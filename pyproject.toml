[project]
name = "worldcup-ai-universe"
version = "1.0.0"
description = "世界杯AI数字球迷生态系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.41",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "feedparser==6.0.11",
  "beautifulsoup4==4.13.4",
  "langchain==0.3.26",
  "langchain-core==0.3.68",
  "langchain-openai==0.3.27",
  "langgraph==0.5.1",
  "langsmith==0.4.4",
  "langchain-chroma==0.2.4",
  "chromadb==1.0.15",
  "numpy==2.2.6",
  "pillow==11.3.0",
  "opencv-python-headless==4.11.0.86",
  "rapidfuzz==3.13.0",
  "tenacity==9.1.2",
  "orjson==3.10.18",
  "pypdf==5.8.0",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "ruff==0.12.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
exclude = [".venv", "frontend"]
